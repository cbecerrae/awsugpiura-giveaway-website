<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorteo | AWS User Group Piura</title>
    <link rel="icon" type="image/svg+xml" href="/sorteo/assets/logo/normal-logo-v2.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/sorteo/styles.css" />
  </head>
  <body>
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <a
      href="https://www.linkedin.com/in/cristhian-becerra/"
      target="_blank"
      rel="noopener noreferrer"
      class="kiro-ghost"
      aria-label="AWS User Group Piura"
    >
      <img src="/sorteo/assets/logo/kiro.png" alt="Kiro" class="kiro-img" />
    </a>

    <main class="page">
      <header class="app-header">
        <a href="https://awsugpiura.com" target="_blank" rel="noopener noreferrer" class="brand" aria-label="AWS User Group Piura">
          <img src="/sorteo/assets/logo/white-logo-letras-horizontal-v2.png" alt="AWS User Group Piura" />
        </a>
        <nav class="top-nav" aria-label="Navegacion principal">
          <a class="nav-pill" href="#" data-view="registrar">Registro</a>
          <a class="nav-pill" href="#" data-view="sortear">Sorteo</a>
          <a class="nav-pill" href="#" data-view="admin">Admin</a>
        </nav>
      </header>

      <section id="app" class="fade-in"></section>
    </main>

    <div id="toastContainer" class="fixed right-4 top-4 z-50 flex w-[90%] max-w-sm flex-col gap-2"></div>

    <div id="winnerModal" class="modal-backdrop">
      <div class="surface w-full max-w-md p-6">
        <h2 class="title" style="font-size: 1.7rem;">Tenemos Ganador(a)</h2>
        <p id="winnerText" class="mt-4 muted text-lg font-semibold"></p>
        <button id="closeWinnerModal" class="btn btn-primary mt-6 w-full">Cerrar</button>
      </div>
    </div>

    <canvas id="confettiCanvas" class="pointer-events-none fixed inset-0 z-40 hidden"></canvas>

    <script src="/sorteo/script.js"></script>
  </body>
</html>
